<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog de Tecnologia e Educação</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Blog de Tecnologia e Educação</h1>
    </header>

    <main>
      <article>
        <img src="imagem_fim_blog.jpg.jpg" alt="Logotipo conceitual de tecnologia e educação...">
        <div>
          <h2>Meu primeiro post</h2>
          <p class="artigo-autor">Por: Marcelo Paludetto</p>
          <p>Boas-vindas ao meu novo blog! Aqui vou compartilhar dicas de programação...</p>
          <button>❤️ <span>0</span></button>
          <button>👍 <span>0</span></button>
        </div>
      </article>

      <article>
        <img src="imagem_fim_blog.jpg.jpg" alt="Logotipo conceitual de tecnologia e educação...">
        <div>
          <h2>Meu segundo post</h2>
          <p class="artigo-autor">Por: Marcelo Paludetto</p>
          <p>Neste segundo post, vamos continuar explorando o desenvolvimento web e lógica de programação!</p>
          <button>❤️ <span>0</span></button>
          <button>👍 <span>0</span></button>
        </div>
      </article>
    </main>

    <script>
      const botoes = document.querySelectorAll("button");

      botoes.forEach(function (botao) {
        let curtiu = false; // Variável de controle inicializada como falso[cite: 13]
        
        botao.addEventListener("click", botaoclicado);

        function botaoclicado() {
          console.log("fui clicado");
          let texto = botao.querySelector("span");

          // Condicional para verificar se ainda não curtiu[cite: 14]
          if (curtiu === false) {
            texto.textContent++;
            curtiu = true; // Atualiza o estado para impedir novos cliques[cite: 14]
          }
        }
      });
    </script>
</body>
</html>
